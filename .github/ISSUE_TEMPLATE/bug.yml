name: Bug report
about: 占位符：用于报告程序错误或异常
title: "[BUG] "
labels: [bug]
assignees: []
body: |
  **问题描述**
  <!-- 在此简要描述问题 -->

  **重现步骤**
  <!-- 请提供重现该问题的步骤 -->

  **期望行为**
  <!-- 说明你期望的行为 -->

  **实际行为**
  <!-- 当前实际行为 -->

  **环境（版本/平台）**
  <!-- 示例：OS、浏览器、依赖版本等 -->

  **附件 / 日志**
  <!-- 可选：粘贴日志或附上截图 -->
